#!/usr/bin/env bash
# Round 1 target descriptor for the developer testbed on nu-daq01-ir2.
# Sourced by deploy.sh; every value here can be overridden per invocation
# with the matching --flag (see deploy/README.md). An absent required value
# is a hard error in deploy.sh, never a silent default -- this file exists
# so the actual invocation is committed and reviewable instead of living
# only in someone's shell history.

# Shared release store. Must not resolve under /home/slacube (guard, D10).
STORE=/opt/slacube

# Git refs, resolved to SHAs and recorded in manifest.json (D7). Override a
# single one with --ref <repo>=<branch|tag|sha>.
REF_DAQ=main
REF_ANALYSIS=master        # analysis defaults to master, not main
REF_SCRIPTS=v2rev2_qc-slac
REF_ETC=main

# Upstream remotes to resolve refs and fetch from.
REMOTE_DAQ=https://github.com/SLACube/slacube-daq.git
REMOTE_ANALYSIS=https://github.com/SLACube/slacube-analysis.git
REMOTE_SCRIPTS=https://github.com/SLACube/larpix-10x10-scripts.git
REMOTE_ETC=https://github.com/SLACube/slacube-etc.git

# Interpreter used to build the release venv (D6).
PYTHON=/usr/bin/python3.8

# Source directory for vendored system binaries (D11). Copied verbatim into
# <release>/ext/ along with a sha256 recorded in manifest.json; must
# contain fzf and mdcat. Store-owned, not /home/slacube -- seed once by
# hand from a known-good copy (see README "One-time setup").
EXT_SRC=/opt/slacube/ext

# Developer testbed dropbox. NEVER /data/slacube/dropbox -- deploy.sh's
# guard refuses that value unconditionally, no override flag exists (D10).
DROPBOX=/data/slacube/dropbox_test

# PACMAN address recorded in the release banner. This does not redirect DAQ
# hardware traffic (see D10) -- it only affects `slacube power`'s ssh target.
PACMAN_ADDR=pacman19.local

# Releases to retain; prune deletes the oldest beyond this count, refusing
# `current` and anything named by a discoverable site file (D14).
KEEP=5
